name: Diagnostic géométrie RFN

on:
  push:
    paths:
      - 'tools/probe_geometry.py'
      - '.github/workflows/probe-geometry.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspecter les données géométriques SNCF Réseau
        run: python tools/probe_geometry.py
